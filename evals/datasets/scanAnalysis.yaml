# Test cases for the Swapple pass-2 scan analysis prompt.
#
# Each case feeds mock enriched product data (the same EnrichedProductData shape
# the production enrichment waterfall produces) plus user priorities, then asserts
# on the structured verdict, reasoning, and brand_recommendations.
#
# NOTE: every input is nested under a single `tc` object var. promptfoo expands
# TOP-LEVEL array vars into a cartesian product of rows; nesting keeps each case
# one row. `tc.expected_verdicts` lists the acceptable verdict set for the case.
# `expected_swap_keywords` / `forbidden_swap_keywords` drive brand-rec assertions.
# Forbidden keywords are checked on recommended brand + product_name only.

- description: "Farm-raised Atlantic salmon — heart & gut health (expect caution/avoid)"
  vars:
    tc:
      priorities: [heart_health, gut_health]
      expected_verdicts: [caution, avoid]
      expected_swap_keywords: [wild, sardine, mackerel, sockeye, alaskan, omega]
      forbidden_swap_keywords: [farm-raised, farm raised, color added]
      items:
        - item_name: "Atlantic Salmon Fillet"
          brand_name: "Farm Fresh"
          enriched:
            source: open_food_facts
            matched: true
            itemName: "Farm-raised Atlantic salmon fillet"
            brandName: "Farm Fresh"
            ingredientsText: "Farm-raised Atlantic salmon (color added)"
            categories: [Seafood, "Farmed fish"]
            nutrients:
              energyKcal: 208
              proteinG: 20
              fatG: 13
              saturatedFatG: 3
              sodiumMg: 59
  assert:
    - type: javascript
      value: file://assertions/validateScanResponse.ts
    - type: javascript
      value: file://assertions/noMedicalLanguage.ts
    - type: javascript
      value: file://assertions/personalization.ts
    - type: javascript
      value: file://assertions/verdictExpectation.ts
    - type: icontains-any
      value: [contaminant, omega, farm, wild, pcb, pollutant]

